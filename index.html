['acct','🔄','انتقال، اصلاحیه و استرداد',['«ثبت اعضا» ← کنار نام «⋯ سایر عملیات» (یا پرونده عضو ← «عملیات روی حساب»).','«انتقال مانده»: بخشی از پس‌انداز یا طلب به عضویت دیگر.','«انتقال کل حساب به صندوق دیگر»: همه پس‌انداز و طلب یک‌جا.','«اصلاحیه»: جابه‌جایی مبلغ اشتباه بین پس‌انداز، قسط و طلب با دلیل.','«بستن حساب / استرداد»: پس دادن پس‌انداز یا طلب.','«جانشینی»: برای عضو متوفی.'],['هیچ تراکنشی حذف نمی‌شود؛ اصلاح همیشه با ثبت جدید و دلیل است تا سابقه بماند.','وام بین دو صندوق منتقل نمی‌شود.']],
['close','📕','اختتامیهٔ سال',['پس از پایان اسفند، زبانه «اختتامیه».','صندوق (یا همه صندوق‌ها) و سال را انتخاب کنید؛ نوار ۱۲ ماه و هشدارها را مرور کنید.','«اختتامیه و قفل سال» را بزنید؛ سند پایان سال ساخته و همهٔ ماه‌ها قفل می‌شوند.','برای اصلاح بعدی، «بازگشایی سال (با ذکر دلیل)».'],['قفل یک ماه در طول سال اختیاری است (پایین همان صفحه).','خروجی اکسل برای مقایسه با دفتر کاغذی یا اکسل قبلی است.']],
['ca','🏦','حساب‌های نقد و بانک',['«بیشتر ← حساب‌های نقد و بانک ← حساب جدید».','نوع، بانک، شماره و به نام را وارد کنید؛ «حساب واریز اعضا» و «پیش‌فرض» را تیک بزنید.','برای حساب مشترک، صندوق‌های دیگر را در بخش «مشترک» تیک بزنید.','«معین» گردش هر حساب را نشان می‌دهد.','«تطبیق با صورت‌حساب بانک»: مانده بانک را وارد کنید و «ثبت» بزنید.'],['حساب مشترک با جمع سهم همه صندوق‌ها تطبیق داده می‌شود.','جابه‌جایی پول بین دو حساب: «انتقال بین حساب‌ها».']],
['fop','💼','رویدادهای مالی صندوق',['«＋ ثبت ← رویداد مالی صندوق».','نوع را انتخاب کنید: انتقال بین حساب‌ها (مثلاً واریز نقد به بانک)، هزینه و کمک خیریه، درآمد، تزریق سرمایه، سپرده بلندمدت، دارایی.','برای هزینه و درآمد «عنوان» را انتخاب کنید یا «➕ عنوان جدید» بسازید.','«مرور و ثبت».'],['عملیات اشتراکی بین چند صندوق تقسیم می‌شود.','ابطال با دلیل انجام می‌شود و رکورد می‌ماند.']],
['jv','📒','سند دستی و نقد اولیه',['«＋ ثبت ← سند دستی» برای رویدادی که فرم ندارد (کارمزد، سود بانکی و…).','از «الگوی آماده» استفاده کنید یا ردیف‌ها را دستی پر کنید؛ جمع بدهکار باید با بستانکار برابر شود.','«نقد اولیه صندوق» موجودی واقعی ابتدای کار را ثبت می‌کند.','در صفحه هر سند: «کپی»، «سند برگشت» و «اصلاح».'],['حساب اعضا در سند دستی نیست تا حساب هر عضو با دفتر یکی بماند.']],
['rmd','💬','مرکز پیام',['«بیشتر ← مرکز پیام» یا دکمه «پیام» در کارهای این ماه.','نوع پیام را انتخاب کنید؛ گیرنده‌ها خودکار انتخاب می‌شوند.','متن را در صورت نیاز ویرایش کنید؛ {نام} {مانده} {قسط} {حساب} خودکار پر می‌شوند.','کنار هر نفر «پیامک»، «واتساپ» یا «کپی پیام».'],['پیام شامل اطلاعات مالی است؛ فقط برای خود فرد بفرستید.']],
['reports','📊','گزارش‌ها، چاپ و اکسل',['«تراز»: وضعیت همه اعضا در ماه یا سال؛ «همه ستون‌ها» برای جزئیات.','«دفتر روزنامه»: اسناد، تراز آزمایشی و دفتر معین (با لمس نام حساب).','«ترازنامه و گزارش سالانه»: برای ارائه به اعضا.','«صورت‌حساب» عضو از پرونده‌اش.','«جابه‌جایی بین صندوق‌ها» و «گزارش رویدادها» برای ردیابی.'],['پایین هر گزارش «خروجی اکسل» و «چاپ / PDF» هست؛ داخل برنامه Claude، PDF در دانلودها ذخیره می‌شود.','سرستون جدول‌ها هنگام پیمایش ثابت می‌ماند.']],
['stats','📈','آمار و نمودار',['«بیشتر ← آمار و نمودار».','صندوق‌ها را با دکمه‌های بالا انتخاب کنید (یکی یا چند تا).','بازه را انتخاب کنید یا «همین ماه»، «امسال تا الان»، «سه ماه اخیر» را بزنید.','نمودارها (گردش ماهانه، روند مانده‌ها، مقایسه صندوق‌ها، ترکیب اعضا)، جدول آمار و «متن خلاصه برای گروه» آماده است؛ روی هر ستون یا نقطه بزنید تا رقمش را ببینید.'],['به‌طور پیش‌فرض نام اشخاص در متن نیست؛ «با نام اشخاص» برای جلسه مدیریتی است.','خروجی اکسل و چاپ / PDF برای جلسه.']],
['ctrl','🛡️','هشدارها و کنترل‌ها',['کدهای E- یعنی خطا: ثبت انجام نمی‌شود تا اصلاح کنید.','کدهای W- یعنی هشدار: ثبت با تأیید شما انجام می‌شود.','«بیشتر ← سلامت داده» یکپارچگی کل داده‌ها را بررسی می‌کند.','«موارد نیازمند بررسی» مواردی است که باید بعداً تصمیم بگیرید.'],['هشدارهای رایج: واحد مبلغ (میلیون تومان)، تاریخ خارج از ماه، قسط یا وام غیرعادی، ثبت تکراری، نقدینگی ناکافی.']],
['bak','💾','پشتیبان و بازیابی',['«بیشتر ← تنظیمات و پشتیبان».','در برنامهٔ نصب‌شده: بخش «پشتیبان ابری رمزدار» را یک بار تنظیم کنید (مخزن، توکن، رمز)؛ بعد از آن هر روز خودکار پشتیبان گرفته می‌شود.','«بازیابی از ابر…» فهرست پشتیبان‌ها را با تاریخ نشان می‌دهد؛ هر کدام را انتخاب کنید و رمز را بزنید.','«دانلود اکسل» یک پشتیبان کامل روی گوشی است و در اکسل هم خوانده می‌شود.'],['اگر رمز پشتیبان فراموش شود، پشتیبان ابری باز نمی‌شود؛ آن را جایی امن یادداشت کنید.','داده‌ها فقط روی همین گوشی است؛ برای گوشی دوم، از پشتیبان ابری بازیابی کنید.','پیش از هر تغییر بزرگ پشتیبان بگیرید.']],
['terms','📚','واژه‌نامه',['پس‌انداز: پول عضو نزد صندوق.','طلب عضو (در حسابداری «بستانکاری»): مازاد پرداخت عضو، جدا از پس‌انداز.','تزریق: پول ورودی که نه پس‌انداز است نه وام؛ بازگشت‌پذیر یا بلاعوض.','نقد اولیه: موجودی واقعی صندوق در شروع کار با برنامه.','بدهکار/بستانکار: دو طرف هر سند؛ جمعشان همیشه برابر است.','اختتامیه: بستن و قفل حساب‌های سال مالی؛ قفل یک ماه اختیاری است.','راکد: عضو فعالی که چند ماه هیچ تراکنشی نداشته.']]];
const GMAP=[[/^(عملیات صندوق|رویدادهای مالی|رویداد مالی)/,'fop'],[/^ثبت تراکنش/,'tx'],[/^(ثبت اعضا|ثبت جمعی)/,'bulk'],[/^واریزی/,'dep'],[/^(تراز|دفتر روزنامه|ترازنامه|گزارش|جابه‌جایی|رویدادها|صورت‌حساب|سابقه شخص)/,'reports'],[/^(مرکز پیام|📨 پیام)/,'rmd'],[/^(🧹 نواقص|📇 تکمیل)/,'mems'],[/^آمار/,'stats'],[/^(صف وام|🎲)/,'loan'],[/^(حساب‌های نقد|حساب جدید|ویرایش حساب)/,'ca'],[/^(سند دستی|نقد اولیه|سند نقد)/,'jv'],[/^(انتقال|اصلاحیه|بستن حساب|جانشینی)/,'acct'],[/^(سلامت داده|موارد نیازمند|🛡️ کنترل)/,'ctrl'],[/^پشتیبان/,'bak'],[/^(صندوق‌ها|سند افتتاحیه)/,'start'],[/^(افزودن عضو|مشخصات|تعیین عنوان|یکی کردن|اشخاص احتمالاً|وضعیت عضویت)/,'mems'],[/^اختتامیه/,'close']];
function gKey(h,k){if(k&&/^d:/.test(k))return 'mems';const m=String(h).match(/<h2>([^<]*)/);if(!m)return '';const x=m[1].trim();for(const [r,g] of GMAP)if(r.test(x))return g;return ''}
function gOpen(k){ui.gk=k;ui.gq='';ui.ht='faq';pg('faq')}
function faq(){const q=[['شخص، عضویت و صندوق چه فرقی دارند؟','یک شخص می‌تواند در چند صندوق عضو باشد؛ هر عضویت حساب مستقل دارد و هیچ‌چیز به‌خاطر هم‌نام بودن ترکیب نمی‌شود.'],['اگر قسط از مانده وام بیشتر باشد؟','مانده وام صفر می‌شود و مازاد به‌صورت «طلب عضو» جدا ثبت می‌شود؛ خودکار به پس‌انداز نمی‌رود.'],['خالی یا صفر؟','خالی یعنی ثبت نشده؛ صفر یعنی صریحاً صفر.'],['ماه بسته را چطور ویرایش کنم؟','از «اختتامیه» با ذکر دلیل بازگشایی کنید؛ سند قبلی و رویداد بازگشایی حفظ می‌شود.'],['انتقال مانده و جانشینی چیست؟','«انتقال مانده» پس‌انداز، طلب یا تعهد وام را با دلیل از یک عضویت به عضویت دیگر می‌برد (دو ثبت هم‌پیوند). «جانشینی» برای عضو متوفی است: شخص و عضویت جدید با ارجاع به او ساخته می‌شود و پولی خودکار منتقل نمی‌شود؛ فقط اگر تیک بزنید.'],['خطای E-PERIOD-GAP یعنی چه؟','ماه‌های قبل ثبت نشده‌اند و ماه بعدی پذیرفته نمی‌شود. یا آن ماه‌ها را ثبت کنید یا در صورت نبودن هر فعالیتی «بدون فعالیت» علامت بزنید. کدهای E-… خطای بازدارنده‌اند و W-… هشدار قابل تأیید (مثل W-FUTURE ماه آینده، W-AMOUNT مبلغ غیرعادی، W-STATUS عضو غیرفعال، W-DUP تکراری).'],['داده‌ها کجا ذخیره می‌شوند؟','هر عملیات فوراً در حافظه همین مرورگر ذخیره می‌شود و در صورت روشن بودن همگام‌سازی، نسخه‌ای امن روی حساب شما هم نگه‌داری می‌شود. حافظه مرورگر به «آدرس صفحه» وابسته است؛ فایل دانلودی یا آدرس دیگر حافظه جدا دارد، پس پشتیبان فایلی بگیرید.'],['سکه یا دارایی صندوق، ارزش افزوده و هدیه چطور ثبت می‌شود؟','از «＋ ثبت ← رویداد مالی صندوق»: «خرید دارایی» نقدینگی را به دارایی (به بهای تمام‌شده) تبدیل می‌کند و درآمد یا هزینه نیست. «فروش دارایی» مبلغ دریافتی را نقدینگی و تفاضل با بهای تمام‌شده را سود یا زیان می‌کند. «درآمد / ارزش افزوده» پولی است که به صندوق برمی‌گردد و «هدیه / هزینه» از نقدینگی کم می‌شود. اشتباه را «ابطال» کنید (با دلیل).'],['تزریق مالی چیست؟','ورود پول از یک عضو یا حامی به صندوق. نه پس‌انداز است نه وام. اگر «بازگشت‌پذیر» باشد بدهی صندوق به او می‌ماند تا با «بازپرداخت تزریق» تسویه شود؛ «بلاعوض» کمک است. نقدینگی محاسباتی آن را حساب می‌کند.'],['اشتباه ثبت شد؛ چه کنم؟','رکورد را ویرایش یا حذف نمی‌کنیم؛ از «اصلاحیه» (پرونده عضو یا موارد نیازمند بررسی) مبلغ را با دلیل بین قسط، پس‌انداز و طلب منتقل کنید. سابقه اصلی و اصلاحیه هر دو می‌مانند.'],['حذف صندوق چگونه است؟','اول «بایگانی» (پنهان و قابل بازگردانی). حذف دائمی فقط برای صندوق بایگانی‌شده و با پشتیبان، نوشتن نام صندوق و تأیید نهایی است.'],['عضو راکد و کم‌پس‌انداز؟','«راکد» نشان خودکار برای عضو فعالی است که چند ماه (پیش‌فرض ۳، در «صندوق‌ها ← ویرایش» قابل تغییر؛ ۰ = خاموش) هیچ تراکنشی نداشته و وام باز ندارد. «کم‌پس‌انداز» فقط وقتی است که برای صندوق حداقل پس‌انداز ماهانه تعریف کنید. هیچ‌کدام وضعیت عضو را خودکار عوض نمی‌کنند؛ از کارت «کارهای این ماه» در خانه می‌توانید انتخاب‌شده‌ها را با دلیل «غیرفعال» کنید. عضو دارای وام باز راکد حساب نمی‌شود؛ او در «خوش‌حسابی» و «مرکز پیام ← یادآوری قسط» دیده می‌شود.'],['پول صندوق کجاست؟','از «بیشتر ← صندوق‌ها ← حساب‌های نقد و بانک» محل نگهداری پول را تعریف کنید (صندوق نقدی، بانک‌ها). در هر ثبت، «محل واریز / برداشت» و «شماره پیگیری» اختیاری‌اند؛ پیش‌فرض، حساب اصلی است. مانده هر حساب در کارت «نقدینگی محاسباتی» دیده می‌شود و با «تطبیق با صورت‌حساب بانک» اختلاف را نشان می‌دهد. جابه‌جایی بین صندوق نقدی و بانک: رویداد مالی صندوق ← «انتقال بین حساب‌ها».'],['سند دستی و نقد اولیه چیست؟','«سند دستی» برای رویدادهای خود صندوق است که فرم جداگانه ندارند (کارمزد یا سود بانکی، جابه‌جایی نقد و بانک، تسویه بین صندوق‌ها): جمع بدهکار باید برابر بستانکار باشد، شرح الزامی است و با «ابطال» از محاسبات خارج می‌شود. حساب اعضا (پس‌انداز، وام، طلب) در سند دستی نیست تا حساب هر عضو با دفتر یکی بماند. «نقد اولیه صندوق» موجودی واقعی نقد و بانک ابتدای دوره است (از سند افتتاحیه یا دفتر روزنامه)؛ تا ثبت نشده، نقدینگی محاسباتی تقریبی است.'],['طلب اعضا (بستانکاری) یعنی چه؟','مبلغی که عضو بیش از مانده وام (مازاد قسط) یا به‌اشتباه پرداخته و نه پس‌انداز است و نه قسط؛ جدا نگه‌داری می‌شود تا به او برگردد. اگر چنین موردی نباشد صفر است و کارتش در صفحه اصلی دیده نمی‌شود.'],['دفتر روزنامه چیست؟','هر رویداد (پس‌انداز، قسط، وام، استرداد، هدیه، تزریق، خرید دارایی…) به‌صورت سند بدهکار/بستانکار نشان داده می‌شود. جمع بدهکار و بستانکار همیشه برابر است و مانده پس‌انداز و وام آن با برنامه کنترل می‌شود (در «سلامت داده»).'],['دکمه بازگشت گوشی؟','بازگشت پنجره‌ها را مرحله‌به‌مرحله می‌بندد (فرم ← صفحه قبلی ← صفحه اصلی). در صفحه اصلی، یک بار دیگر بزنید تا خارج شوید. اگر فرم نیمه‌پر باشد، قبل از دور ریختن می‌پرسد.'],['اگر وام جدید را اشتباه ثبت کردم؟','وام ثبت‌شده حذف نمی‌شود؛ از پرونده عضو ← بخش «وام‌ها» ← «ابطال (ثبت اشتباه)». یک ثبت معکوس با دلیل ساخته می‌شود و وام «باطل‌شده» نشان داده می‌شود. اگر بعد از وام قسطی ثبت شده، ابتدا همان قسط را با «اصلاحیه» جابه‌جا کنید.'],['پس‌انداز عضو را برگرداندیم؛ چگونه ثبت شود؟','ثبت تکی ← نوع «استرداد پس‌انداز»، یا پرونده عضو ← «بستن حساب / استرداد» که استرداد را ثبت و وضعیت را عوض می‌کند. برای عضو خارج‌شده یا غیرفعال هم کار می‌کند.'],['هدیه به اعضا (مثلاً عسل)؟','رویداد مالی صندوق ← هدیه ← «توزیع بین اعضا»: مبلغ کل را بنویسید، گیرندگان را انتخاب کنید (پیش‌فرض فعال‌ها) و تقسیم مساوی یا دلخواه را بزنید. هدیه هزینه صندوق است و در پرونده هر عضو «هدیه‌های دریافتی» دیده می‌شود.'],['تراز و صورت‌حساب؟','بیشتر ← «تراز ماهانه و سالانه» برای همه یا چند صندوق، با جمع ستون‌ها و دریافتی/پرداختی. صورت‌حساب هر عضو از پرونده او (دکمه «صورت‌حساب») با خروجی اکسل و چاپ.'],['مبلغ‌ها را چطور بنویسم؟','واحد میلیون تومان است و تا دو رقم اعشار مجاز است؛ مثلاً ۰٫۲۵ یعنی ۲۵۰ هزار تومان. نقطه، «٫» و «/» و ویرگول هر چهار به‌عنوان اعشار پذیرفته می‌شوند (۰/۵ و ۰٫۵ و .5 و ۰,۵). اعشار فقط در صورت وجود نمایش داده می‌شود.'],['سلامت داده چیست؟','بررسی خودکار یکپارچگی: شناسه‌های تکراری، تراکنش بی‌صاحب، انتقال‌های ناقص، مانده‌های منفی، مغایرت با اسناد اختتامیه و زنجیره رویدادها. فقط گزارش می‌دهد و چیزی را تغییر نمی‌دهد.'],['صف وام و خوش‌حسابی چطور کار می‌کند؟','هر عضو فعالِ بدون بدهی می‌تواند در «صف وام» بیاید. خوش‌حسابی از نسبت ماه‌هایی که قسط ثبت شده به ماه‌هایی که وام داشته محاسبه می‌شود (بر اساس ماه، نه روز). با صدور وام، درخواست خودکار «صادر شد» می‌شود.'],['مرکز پیام چگونه است؟','«بیشتر ← مرکز پیام به اعضا». نوع پیام را انتخاب کنید (یادآوری قسط، یادآوری پس‌انداز، تشکر از پرداخت، تبریک تسویه وام، اطلاعیه به const GHP='sandooghyar-backup.enc.json';
function ghRaw(){try{return JSON.parse(window.localStorage.getItem('sy.gh')||'{}')}catch(e){return {}}}
function ghWrite(o){try{window.localStorage.setItem('sy.gh',JSON.stringify(o))}catch(e){}}
function ghCfg(){const o=ghRaw();if(o.sec){delete o.sec;if(GHS)Object.assign(o,GHS)}return o}
function ghSet(o){if(lkOn()&&LKK){GHS={};if(o.tok)GHS.tok=o.tok;if(o.pass)GHS.pass=o.pass;ghWrite({repo:o.repo,auto:o.auto,sec:ghRaw().sec});lkSeal().catch(()=>{})}else ghWrite(o)}
function b64e(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function zIn(u){if(typeof CompressionStream=='undefined')return [u,0];const cs=new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'));return [new Uint8Array(await new Response(cs).arrayBuffer()),1]}
async function zOut(u,z){if(!z)return u;const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(ds).arrayBuffer())}
async function ckey(pass,salt,use){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use])}
async function encPack(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),[z,zf]=await zIn(new TextEncoder().encode(JSON.stringify(obj))),k=await ckey(pass,salt,'encrypt'),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,z));return {app:'SandooghYar',v:1,kdf:'PBKDF2-SHA256',it:150000,alg:'AES-GCM-256',z:zf,salt:b64e(salt),iv:b64e(iv),ct:b64e(ct),at:new Date().toISOString(),ver:VER,n:{f:S.funds.length,m:S.mems.length,t:S.tx.length}}}
async function decPack(pk,pass){if(!pk||pk.app!='SandooghYar'||!pk.ct)throw new Error('format');const k=await ckey(pass,b64d(pk.salt),'decrypt');let pt;try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pk.iv)},k,b64d(pk.ct)))}catch(e){throw new Error('pass')}return JSON.parse(new TextDecoder().decode(await zOut(pt,pk.z)))}
async function gh(path,opt,raw){const c=ghCfg();const r=await fetch('https://api.github.com/repos/'+c.repo+path,Object.assign({cache:'no-store'},opt||{},{headers:Object.assign({Authorization:'Bearer '+c.tok,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},(opt||{}).headers||{})}));return r}
function ghWhy(st){return st==401?'توکن نامعتبر یا منقضی است؛ توکن تازه بسازید.':st==403?'توکن به این مخزن اجازهٔ نوشتن ندارد (Contents: Read and write).':st==404?'مخزن پیدا نشد یا توکن به آن دسترسی ندارد.':st==0?'اینترنت در دسترس نیست.':'خطای GitHub ('+st+').'}

const lkOn=()=>!!(CFG.lk&&CFG.lk.wp);
async function lkKey(pin,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode('sy-lock|'+pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aEnc(k,u){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64e(iv),ct:b64e(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,u)))}}
async function aDec(k,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.ct)))}
function lkImp(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function lkSeal(){const r=ghRaw(),x=GHS||{};r.sec=await aEnc(LKK,new TextEncoder().encode(JSON.stringify({tok:x.tok||null,pass:x.pass||null})));delete r.tok;delete r.pass;ghWrite(r)}
async function lkOpen(){const r=ghRaw();GHS=null;if(r.sec){try{const j=JSON.parse(new TextDecoder().decode(await aDec(LKK,r.sec)));GHS={};if(j.tok)GHS.tok=j.tok;if(j.pass)GHS.pass=j.pass}catch(e){GHS=null}}}
function kdb(){return new Promise((ok,no)=>{try{const q=indexedDB.open('sandooghyar-k',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}})}
async function kOp(mode,n,v){const d=await kdb();return new Promise((ok,no)=>{const t=d.transaction('k',mode=='get'?'readonly':'readwrite'),st=t.objectStore('k'),r=mode=='get'?st.get(n):mode=='put'?st.put(v,n):st.delete(n);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function lkBioOk(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function lkBioReg(raw){try{if(!(await lkBioOk()))return null;const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'صندوق‌یار',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'sandooghyar',displayName:'صندوق‌یار'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});const dk=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await kOp('put','dk',dk);return {cid:b64e(new Uint8Array(c.rawId)),wd:await aEnc(dk,raw)}}catch(e){return null}}
async function lkEnable(pin,bio){const raw=crypto.getRandomValues(new Uint8Array(32)),salt=crypto.getRandomValues(new Uint8Array(16)),cur=ghCfg(),lk={s:b64e(salt),wp:await aEnc(await lkKey(pin,salt),raw),t:3};LKK=await lkImp(raw);if(bio){const r=await lkBioReg(raw);if(r){lk.cid=r.cid;lk.wd=r.wd}}CFG.lk=lk;cfgSave();GHS={};if(cur.tok)GHS.tok=cur.tok;if(cur.pass)GHS.pass=cur.pass;if(cur.tok||cur.pass)await lkSeal();audit('قفل برنامه','فعال شد'+(lk.cid?' (با اثر انگشت)':''));save();return lk}
async function lkRaw(pin){const L=CFG.lk;try{return await aDec(await lkKey(pin,b64d(L.s)),L.wp)}catch(e){return null}}
async function lkPin(pin){const raw=await lkRaw(pin);if(!raw)return false;LKK=await lkImp(raw);await lkOpen();return true}
async function lkBio(){const L=CFG.lk;if(!L||!L.cid)return false;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:b64d(L.cid)}],userVerification:'required',timeout:60000}});const dk=await kOp('get','dk');if(!dk)return false;LKK=await lkImp(await aDec(dk,L.wd));await lkOpen();return true}catch(e){return false}}
async function lkChange(oldp,newp){const raw=await lkRaw(oldp);if(!raw)return false;const salt=crypto.getRandomValues(new Uint8Array(16));CFG.lk.s=b64e(salt);CFG.lk.wp=await aEnc(await lkKey(newp,salt),raw);cfgSave();audit('قفل برنامه','رمز ورود عوض شد');save();return true}
async function lkDisable(pin){if(!(await lkRaw(pin)))return false;const g=ghCfg();delete CFG.lk;cfgSave();ghWrite(g);LKK=null;GHS=null;try{await kOp('del','dk')}catch(e){}audit('قفل برنامه','خاموش شد');save();return true}

  const pk=await encPack({app:'SandooghYar',ver:VER,at:new Date().toISOString(),data:S},pass);pk.dev=devN();const body=b64e(new TextEncoder().encode(JSON.stringify(pk)));

  CFG.cbk={at:new Date().toISOString(),ok:1};CFG.lb=CFG.cbk.at;CFG.ch=0;cfgSave();if(manual){audit('پشتیبان ابری رمزدار',c.repo);save();CFG.ch=0;cfgSave();if(SK=='pg:bak')pg('bak');try{draw()}catch(x){}note('✅ <b>پشتیبان رمزدار ذخیره شد.</b><div class="k">'+dtf(CFG.cbk.at)+' • '+F(S.tx.length)+' تراکنش • مخزن '+esc(c.repo)+'</div>')}else{if(!quiet)toast('🔐 پشتیبان خودکار انجام شد');try{if(ui.tab=='home'&&$('sh').style.display!='block')draw()}catch(x){}}return true}
 catch(e){const st=e&&e.st!=null?e.st:0;CFG.cbk=Object.assign({},CFG.cbk||{},{err:ghWhy(st),eat:new Date().toISOString()});cfgSave();if(manual)note('پشتیبان ابری ناموفق بود: '+ghWhy(st));return false}finally{CBB=false}}

var VQ_FILL=new Set(['چقدر','چقدره','چنده','چند','چیه','چی','هست','است','رو','را','بگو','بده','نشون','نشان','لطفا','لطفاً','مال','برای','ی','از','به','در','که','کیه','کی','کیا','داره','دارد','دارن','شده','شد','این','اون','آن','باز','کن','برو','بزن','صفحه','بیار','میخوام','می','خوام','من','ما','همه','الان','فعلا','ماه','امسال','تا']),VQ_KEY=/وام|پس ?انداز|پسانداز|قسط|اقساط|بستانکار|طلب|موجودی|مانده|مونده|بدهی|بدهکار|حساب/;
function vqStrip(q){return ctTok(q).filter(t=>!VQ_FILL.has(t))}
function vqAct(a,qa){const w=ctTok(a[0]+' '+a[2]);return qa.filter(t=>w.includes(t)).length>=Math.min(2,qa.length)&&qa.some(t=>ctTok(a[0]).includes(t))}

function vqSmart(q){const mi=vqMonth(q),i=mi!=null?mi:ui.p;
 if(/قسط|اقساط/.test(q)&&/نداده|ندادن|نپرداخت|نریخت|عقب|مونده|مانده|بدهکار/.test(q)&&/کی|کیا|کسانی|چه کسی|چند نفر|کدوم|کدام|لیست|فهرست/.test(q)){const fs=AF().filter(f=>ctTok(f.name).filter(t=>t!='صندوق'&&t!='مسجد').some(t=>q.includes(t))),L=rdue(i,fs.length?fs:true);return '<div class="c"><b>⏳ قسط '+ml(i)+' ثبت نشده — '+F(L.length)+' نفر'+(fs.length?' • '+esc(fs.map(f=>f.name).join('، ')):'')+'</b>'+L.slice(0,20).map(r=>'<div class="row tap" onclick="detail(\''+r.m.id+'\')"><span>'+esc(pt(r.m))+' <span class="k">'+esc(r.f.name)+'</span></span><b>'+(r.g===''?'—':F(r.g))+'</b></div>').join('')+(L.length?'<button class="b g" style="width:100%;margin-top:6px" onclick="ui.mt=\'inst\';ui.rf='+JSON.stringify((fs.length?fs:AF()).map(f=>f.id)).replace(/"/g,"'")+';pg(\'rmd\')">📨 فرستادن یادآوری</button>':'')+'</div>'}
 if(!VQ_KEY.test(q))return '';const qt=vqStrip(q).filter(t=>!VQ_KEY.test(t)&&!M.includes(t)&&t.length>1);if(!qt.length)return '';
 const H=S.mems.filter(m=>!fund(m.fid).archived).map(m=>{const nt=ctTok(pn(m).replace(/\(.*?\)/g,''));const hit=qt.filter(t=>nt.includes(t)).length;return {m,hit,all:nt.length&&nt.every(t=>qt.includes(t))}}).filter(x=>x.hit>=Math.min(2,qt.length)&&x.hit>0);if(!H.length)return '';
 const best=Math.max(...H.map(x=>x.hit)),L=H.filter(x=>x.hit==best).slice(0,5);
 return L.map(({m})=>{const b=bal(m.id,i),g=sugg(m.id,i),paid=S.tx.some(t=>t.mid==m.id&&t.per==pk(m.fid,i)&&t.type=='inst'),rc=actRcv(m.id);return '<div class="c tap" onclick="detail(\''+m.id+'\')"><b>👤 '+esc(pt(m))+'</b> <span class="tg x">'+esc(fund(m.fid).name)+'</span> <span class="k">'+ml(i)+'</span><div class="row"><span>💰 پس‌انداز</span><b class="pos">'+F(b.s)+'</b></div><div class="row"><span>💳 وام باقی‌مانده</span><b class="dbt">'+F(Math.max(b.l,0))+'</b></div>'+(b.l>0?'<div class="row"><span>⏳ قسط این ماه</span><b>'+(paid?'✓ ثبت شده':g===''?'—':F(g)+' (ثبت نشده)')+'</b></div>':'')+(b.c?'<div class="row"><span>🔵 طلب</span><b>'+F(b.c)+'</b></div>':'')+(rc?'<div class="k">👤 گیرنده واقعی: '+esc(rc.rcv)+'</div>':'')+'</div>'}).join('')}

function pmIgn(ids){const a=ids.split(',');S.pmIgn=S.pmIgn||[];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++){const k=[a[x],a[y]].sort().join('|');if(!S.pmIgn.includes(k))S.pmIgn.push(k)}audit('اشخاص متفاوت',a.join('، '));save();toast('ثبت شد؛ دیگر پیشنهاد نمی‌شود');if(SK=='pg:nq')pg('nq');else pmrgList()}
function nqData(fl){const act=S.mems.filter(m=>m.status!='متوفی'&&m.status!='خارج‌شده'&&!fund(m.fid).archived),P=[...new Set(act.map(m=>m.pid))].map(id=>S.persons.find(p=>p.id==id)).filter(Boolean),loan=pid=>act.some(m=>m.pid==pid&&bal(m.id).l>0),multi=pid=>pmems(pid).length>1,ok=p=>!fl||(fl=='loan'?loan(p.id):fl=='multi'?multi(p.id):true);
 const noPh=P.filter(p=>!pSend(p).length&&ok(p)),noG=P.filter(p=>!p.g&&ok(p)),dup=pmrgCands().filter(a=>!fl||a.some(ok)),rcv=LN().filter(l=>l.rcv&&!l.rph&&mem(l.mid)&&bal(l.mid).l>0&&ok(S.persons.find(p=>p.id==mem(l.mid).pid)||{})),ph={};P.forEach(p=>pTels(p).forEach(t=>{(ph[t.n]=ph[t.n]||[]).push(p)}));const dupPh=Object.entries(ph).filter(([n,a])=>a.length>1&&a.some(ok));
 return {noPh,noG,dup,rcv,dupPh,n:noPh.length+noG.length+dup.length+rcv.length+dupPh.length}}

 +sec('📞','بدون شماره همراه',D.noPh,p=>'<div class="row"><span>'+esc(p.name)+'<div class="k">'+nqFunds(p.id)+'</div></span></div><div class="msr" style="margin-bottom:8px"><input id="nqp_'+p.id+'" inputmode="tel" dir="ltr" placeholder="09…">'+(cpOK()?'<button class="b g" onclick="nqPick(\''+p.id+'\')">📱</button>':'')+'<button class="b" onclick="nqSave(\''+p.id+'\')">ثبت</button></div>','<a href="#" onclick="pg(\'ctim\');return false">📇 یا همه را یکجا از مخاطبین گوشی تکمیل کنید</a>')
 +sec('🚻','بدون عنوان آقا / خانم',D.noG,p=>'<div class="row" id="nqg_'+p.id+'"><span>'+esc(p.name)+'<div class="k">'+nqFunds(p.id)+'</div></span><span><button class="ch" onclick="gpick(\''+p.id+'\',\'m\');pg(\'nq\')">آقا</button> <button class="ch" onclick="gpick(\''+p.id+'\',\'f\');pg(\'nq\')">خانم</button></span></div>','برای «آقای / خانم» درست در پیام‌ها و گزارش‌ها.')
